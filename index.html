<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>欣安邨巴士資訊屏 v2</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
background:#050505;
color:#fff;
height:100vh;
overflow:hidden;
padding:15px;
display:flex;
flex-direction:column;
cursor:pointer;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:2px solid #333;
padding-bottom:12px;
margin-bottom:12px;
}

.title{
font-size:24px;
font-weight:900;
color:#ffcc00;
}

.live{
background:#d60000;
padding:3px 8px;
border-radius:4px;
font-size:12px;
margin-left:8px;
}

.clock{
font-size:30px;
font-family:monospace;
font-weight:bold;
color:#00ffcc;
}

.bus-list{
flex:1;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:10px;
}

.bus-card{
background:#121212;
border-left:6px solid #e60012;
border-radius:8px;
padding:12px 16px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 3px 10px rgba(0,0,0,.5);
}

.route-block{
display:flex;
align-items:center;
gap:15px;
}

.route{
font-size:34px;
font-weight:900;
width:90px;
}

.dest{
font-size:18px;
font-weight:bold;
}

.stop{
font-size:12px;
color:#999;
margin-top:3px;
}

.eta-main{
font-size:28px;
font-weight:bold;
color:#00ff66;
text-align:right;
}

.arriving{
color:#ff4444;
animation:blink 1s infinite;
}

.eta-sub{
font-size:11px;
color:#888;
text-align:right;
margin-top:4px;
}

footer{
display:flex;
justify-content:space-between;
font-size:12px;
color:#888;
border-top:1px solid #222;
padding-top:10px;
margin-top:10px;
}

.ok{
color:#00cc66;
}

.err{
color:#ff5555;
}

@keyframes blink{
50%{
opacity:.2;
}
}
</style>
</head>
<body>

<header>

<div class="title">
欣安邨 巴士資訊屏
<span class="live">LIVE</span>
</div>

<div class="clock" id="clock">
--:--:--
</div>

</header>

<div class="bus-list" id="busList">

<div style="padding:40px;text-align:center;color:#888;">
正在載入資料...
</div>

</div>

<footer>

<div id="status">
初始化中...
</div>

<div id="lastUpdate">
--
</div>

</footer>

<script>

const TARGET_STOPS = [
'欣安',
'恒安',
'保泰街',
'海典灣',
'聽濤雅苑',
'頌安'
];

const ROUTE_WHITELIST = [
'43X',
'81C',
'85K',
'85X',
'87D',
'89C',
'286C',
'286M',
'286D',
'680',
'681',
'681P',
'682A',
'N287',
'NA40',
'A41P'
];

let discoveredStops = [];
let routeData = [];

/* 全螢幕 */

document.body.addEventListener('click', async () => {

if(!document.fullscreenElement){

try{
await document.documentElement.requestFullscreen();
}catch(e){}

}

});

/* Wake Lock */

async function enableWakeLock(){

if('wakeLock' in navigator){

try{
await navigator.wakeLock.request('screen');
}catch(e){
console.log(e);
}

}

}

enableWakeLock();

/* 時鐘 */

function updateClock(){

const now = new Date();

document.getElementById('clock').innerText =
now.toLocaleTimeString('zh-HK',{
hour12:false
});

updateCountdowns(now);

}

setInterval(updateClock,1000);
updateClock();

/* 搜尋附近站 */

async function discoverStops(){

try{

console.log('開始讀取KMB站點');

const res = await fetch(
'https://data.etabus.gov.hk/v1/transport/kmb/stop'
);

const json = await res.json();

console.log('STOP DATA',json);

if(!json.data){
return [];
}

const found = json.data.filter(stop=>{

const name = stop.name_tc || '';

return TARGET_STOPS.some(
keyword => name.includes(keyword)
);

});

console.log('FOUND STOPS',found);

return found.map(stop=>({

id: stop.stop,
name: stop.name_tc

}));

}catch(err){

console.error(err);

return [];
}

}

/* 合併路線 */

function groupRoutes(data){

const grouped = {};

data.forEach(item=>{

const key =
item.route + '_' + item.dest;

if(!grouped[key]){

grouped[key] = {

route:item.route,
dest:item.dest,
stopName:item.stopName,
etas:[]
};

}

grouped[key].etas.push(item.etaTime);

});

return Object.values(grouped)

.map(route=>{

route.etas.sort(
(a,b)=>a-b
);

route.etas =
route.etas.slice(0,3);

return route;

})

.sort(
(a,b)=>
a.etas[0]-b.etas[0]
);

}

/* ETA */

async function fetchETA(){

if(!discoveredStops.length){
return;
}

const allEta = [];

for(const stop of discoveredStops){

try{

const url =
`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stop.id}?_=${Date.now()}`;

const res = await fetch(url,{
cache:'no-store'
});

if(!res.ok){
continue;
}

const json = await res.json();

if(!json.data){
continue;
}

json.data.forEach(item=>{

if(!item.eta){
return;
}

if(
ROUTE_WHITELIST.length &&
!ROUTE_WHITELIST.includes(item.route)
){
return;
}

const etaTime =
new Date(item.eta);

if(etaTime <= new Date()){
return;
}

allEta.push({

route:item.route,
dest:item.dest_tc,
stopName:stop.name,
etaTime

});

});

}catch(err){

console.error(err);

}

}

routeData =
groupRoutes(allEta)
.slice(0,12);

renderRoutes();

document.getElementById('status').innerHTML =
'<span class="ok">● 官方API正常</span>';

document.getElementById('lastUpdate').innerText =
new Date().toLocaleTimeString('zh-HK',{
hour12:false
});

}

/* Render */

function renderRoutes(){

const container =
document.getElementById('busList');

if(!routeData.length){

container.innerHTML =
'<div style="padding:40px;text-align:center;color:#888;">暫無班次資料</div>';

return;
}

container.innerHTML =
routeData.map((route,index)=>{

const etaText =
route.etas.map(eta=>{

const mins =
Math.ceil(
(eta - new Date()) / 60000
);

if(mins <= 1){
return '即將到站';
}

return mins + '分鐘';

}).join(' ｜ ');

return `

<div class="bus-card">

<div class="route-block">

<div class="route">
${route.route}
</div>

<div>

<div class="dest">
往 ${route.dest}
</div>

<div class="stop">
${route.stopName}
</div>

</div>

</div>

<div>

<div class="eta-main"
id="eta-${index}">
${etaText}
</div>

<div class="eta-sub">
共 ${route.etas.length} 班
</div>

</div>

</div>

`;

}).join('');

}

/* 每秒更新ETA */

function updateCountdowns(now){

routeData.forEach((route,index)=>{

const el =
document.getElementById(
`eta-${index}`
);

if(!el){
return;
}

const etaText =
route.etas.map(eta=>{

const mins =
Math.ceil(
(eta - now) / 60000
);

if(mins <= 1){
return '即將到站';
}

return mins + '分鐘';

}).join(' ｜ ');

el.innerHTML = etaText;

if(
etaText.includes('即將到站')
){
el.classList.add('arriving');
}else{
el.classList.remove('arriving');
}

});

}

/* 初始化 */

async function init(){

document.getElementById(
'status'
).innerText =
'搜尋附近巴士站中...';

discoveredStops =
await discoverStops();

console.log(
'DISCOVERED STOPS',
discoveredStops
);

if(!discoveredStops.length){

document.getElementById(
'status'
).innerHTML =
'<span class="err">找不到目標車站</span>';

return;

}

await fetchETA();

setInterval(
fetchETA,
15000
);

}

init();

</script>

</body>
</html>
