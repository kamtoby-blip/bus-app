<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KMB API Explorer</title>

<style>
body{
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
  padding:20px;
}

h1{
  color:#ffcc00;
}

button{
  padding:10px 20px;
  font-size:16px;
  margin:10px 0;
}

#log{
  white-space:pre-wrap;
  background:#222;
  padding:15px;
  border-radius:8px;
  max-height:80vh;
  overflow:auto;
}
</style>
</head>
<body>

<h1>KMB Stop Finder</h1>

<p>搜尋欣安 / 恒安 / 保泰街 / 海典灣 / 聽濤雅苑相關站位</p>

<button onclick="runExplorer()">
開始掃描
</button>

<div id="log">
等待開始...
</div>

<script>

const TARGET_ROUTES = [
'43X',
'81C',
'85K',
'85X',
'87D',
'89C',
'286M',
'286D',
'680',
'681P',
'682A',
'A41P'
];

const TARGET_KEYWORDS = [
'欣安',
'恒安',
'保泰街',
'海典灣',
'聽濤雅苑',
'頌安'
];

const logEl =
document.getElementById('log');

function log(text){

  logEl.textContent +=
  '\n' + text;

}

async function runExplorer(){

  logEl.textContent = '';

  try{

    log('下載 Route Stop...');

    const rs =
    await fetch(
      'https://data.etabus.gov.hk/v1/transport/kmb/route-stop/'
    );

    const rsJson =
    await rs.json();

    const routeStops =
      rsJson.data.filter(
        x=>TARGET_ROUTES.includes(x.route)
      );

    const stopIds =
      [...new Set(
        routeStops.map(
          x=>x.stop
        )
      )];

    log(
      '發現 Stop 數量: ' +
      stopIds.length
    );

    const matched = [];

    let checked = 0;

    for(
      const stopId of stopIds
    ){

      checked++;

      if(
        checked % 20 === 0
      ){
        log(
         `已檢查 ${checked}/${stopIds.length}`
        );
      }

      try{

        const stopRes =
        await fetch(
        `https://data.etabus.gov.hk/v1/transport/kmb/stop/${stopId}`
        );

        const stopJson =
        await stopRes.json();

        const stop =
        stopJson.data;

        if(!stop){
          continue;
        }

        const name =
          stop.name_tc || '';

        const found =
          TARGET_KEYWORDS.some(
            keyword=>
            name.includes(keyword)
          );

        if(found){

          matched.push({
             stopId,
             name
          });

          log(
          '✅ FOUND: ' +
          name +
          ' [' +
          stopId +
          ']'
          );

        }

      }catch(err){

        console.log(err);

      }

    }

    log('');
    log('========= RESULT =========');

    matched.forEach(item=>{

      log(
      item.name +
      ' => ' +
      item.stopId
      );

    });

    log('');
    log(
    '總數
